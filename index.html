<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>טניס פיקסל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="console">
  <div id="bezel">
    <div id="lcd">
      <div id="hud"></div>
      <div id="stage">
        <canvas id="c" width="160" height="240"></canvas>
        <div id="bubble" hidden></div>
        <div id="msg" hidden></div>
        <div id="overlay"></div>
      </div>
    </div>
  </div>
  <div id="brand">PIXEL <i>TENNIS</i></div>
  <div id="controls">
    <div id="stick" aria-label="כיוונים">
      <div class="arm h"></div><div class="arm v"></div>
      <div class="dir up"></div><div class="dir down"></div><div class="dir left"></div><div class="dir right"></div>
    </div>
    <div id="sys">
      <button id="btnMenu" type="button">MENU</button>
      <button id="btnSound" type="button">SOUND</button>
    </div>
    <div id="awrap"><button id="btnA" type="button">A</button><span>הכה</span></div>
  </div>
  <p id="hint">מקלדת: חצים / WASD לזוז · רווח להכות ולהגיש · כיוון בזמן המכה קובע לאן הכדור הולך</p>
</div>
<script src="game.js"></script>
</body>
</html>
