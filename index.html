<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>טניס מרחוק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div id="hud"></div>
    <button id="btnSound" type="button" aria-label="צליל"></button>
    <button id="btnPause" type="button" aria-label="הפסקה">❚❚</button>
  </div>
  <div id="stage">
    <canvas id="c" width="160" height="240"></canvas>
    <div id="bubble" hidden></div>
    <div id="msg" hidden></div>
    <div id="tip" hidden>נגיעה במסך להגשה</div>
    <div id="overlay"></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
